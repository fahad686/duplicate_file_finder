name: duplicate_file_finder
description: "Find and remove duplicate files to free up storage space."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  permission_handler: ^11.3.1
  crypto: ^3.0.6
  open_file: ^3.5.4
  intl: ^0.19.0
  path: ^1.9.1
  shared_preferences: ^2.5.3
  video_player: ^2.9.2
  just_audio: ^0.9.42

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
